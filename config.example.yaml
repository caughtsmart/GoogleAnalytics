# Loaded Dice daily GA4 analyst — configuration.
# Copy this file to config.yaml and fill in the real values.
# config.yaml is gitignored; never commit real credentials.

ga4:
  # Numeric property ID from GA4 Admin -> Property Settings
  # (NOT the G-XXXX measurement ID).
  property_id: "123456789"
  # Path to the service account JSON key. Keep it outside the repo or in
  # the gitignored secrets/ folder. Treat it like a password.
  credentials_file: "secrets/service-account.json"

timezone: "Europe/London"   # decides what "yesterday" means
currency: "£"

baselines:
  rolling_days: 28          # the "normal" a day is judged against

anomalies:
  threshold_pct: 25         # flag moves beyond ±25% vs the 28-day average
  min_sessions: 30          # ignore % swings when visits are below this
  min_purchases: 3          # same idea for order-based metrics

products:
  top_n: 5                  # products listed in the detail tables
  interest_no_sales_min_views: 25   # 7-day views needed to call out a stalled product

reports_dir: "reports"      # dated HTML copies land here

email:
  enabled: true
  to:
    - "graham@loadeddice.uk"
  from: "reports@loadeddice.uk"
  smtp_host: "smtp.gmail.com"       # any SMTP provider works
  smtp_port: 587                    # 587 = STARTTLS, 465 = SSL
  smtp_username: "reports@loadeddice.uk"
  # Do NOT put the password here. Set the environment variable instead:
  #   export GA4_SMTP_PASSWORD="your-app-password"
