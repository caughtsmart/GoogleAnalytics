# Runs the daily GA4 report on GitHub's servers — no always-on machine needed.
#
# To enable it, add three repository secrets (Settings -> Secrets and
# variables -> Actions):
#   GA4_CONFIG_YAML          - the full contents of your config.yaml
#   GA4_SERVICE_ACCOUNT_JSON - the full contents of the service account key
#   GA4_SMTP_PASSWORD        - the SMTP/app password for the sending mailbox
#
# Until those secrets exist the job simply skips, so this file is safe to
# keep in the repo from day one.

name: Daily GA4 report

on:
  schedule:
    # 06:15 UTC = 07:15 UK in summer, 06:15 in winter. GA4 has usually
    # finalised yesterday by then. Adjust if the report ever looks thin.
    - cron: "15 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # to commit the dated report back into reports/

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are configured
        id: gate
        env:
          CONFIG: ${{ secrets.GA4_CONFIG_YAML }}
        run: |
          if [ -z "$CONFIG" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GA4_CONFIG_YAML secret not set - skipping run."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Write config and credentials
        if: steps.gate.outputs.ready == 'true'
        env:
          GA4_CONFIG_YAML: ${{ secrets.GA4_CONFIG_YAML }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GA4_CONFIG_YAML" > config.yaml
          mkdir -p secrets
          printf '%s' "$GA4_SERVICE_ACCOUNT_JSON" > secrets/service-account.json

      - name: Run the report
        if: steps.gate.outputs.ready == 'true'
        env:
          GA4_SMTP_PASSWORD: ${{ secrets.GA4_SMTP_PASSWORD }}
        run: python run_daily_report.py

      - name: Commit the dated report for history
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/*.html
          if git diff --cached --quiet; then
            echo "No new report to commit."
          else
            git commit -m "Daily GA4 report $(date -u +%F)"
            git push
          fi
